name: Deploy Main

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      rollback_vercel_deployment:
        description: "Optional previous Vercel deployment URL/ID to rollback instead of deploying"
        required: false
        type: string

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  quality-gates:
    name: Re-run CI gates before deploy
    if: ${{ vars.DEPLOY_ENABLED == 'true' && (github.event_name != 'workflow_dispatch' || inputs.rollback_vercel_deployment == '') }}
    uses: ./.github/workflows/ci.yml

  rollback-vercel:
    name: Rollback Frontend on Vercel
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' && inputs.rollback_vercel_deployment != '' && inputs.rollback_vercel_deployment != 'diagnose' && inputs.rollback_vercel_deployment != 'diagnose-vps') }}
    steps:
      - name: Rollback requested deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          ROLLBACK_DEPLOYMENT: ${{ inputs.rollback_vercel_deployment }}
        run: |
          test -n "$ROLLBACK_DEPLOYMENT"
          if [[ "$ROLLBACK_DEPLOYMENT" == restore:* ]]; then
            npx vercel promote "${ROLLBACK_DEPLOYMENT#restore:}" --yes --token="$VERCEL_TOKEN"
          else
            npx vercel rollback "$ROLLBACK_DEPLOYMENT" --yes --token="$VERCEL_TOKEN"
          fi

  inspect-vercel:
    name: Inspect Vercel deployment history
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback_vercel_deployment == 'diagnose' }}
    steps:
      - name: Read production deployment history and active alias
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          node <<'NODE'
          const auth = { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` };
          const teamId = encodeURIComponent(process.env.VERCEL_ORG_ID);
          const projectId = encodeURIComponent(process.env.VERCEL_PROJECT_ID);
          for (const [label, url] of [
            ['deployments', `https://api.vercel.com/v6/deployments?projectId=${projectId}&teamId=${teamId}&limit=30`],
            ['production-alias', `https://api.vercel.com/v4/aliases/solarnext-crm.fr?teamId=${teamId}`],
          ]) {
            const response = await fetch(url, { headers: auth });
            const data = await response.json();
            if (!response.ok) { console.log(label, response.status, data.error?.code); continue; }
            if (label === 'deployments') {
              console.log(label, data.deployments.map(d => ({
                uid: d.uid, url: d.url, createdAt: d.createdAt, target: d.target,
                readyState: d.readyState, readySubstate: d.readySubstate,
                aliasAssigned: d.aliasAssigned, alias: d.alias,
              })));
            } else {
              console.log(label, { alias: data.alias, deploymentId: data.deploymentId, uid: data.uid, created: data.created });
            }
          }
          NODE

  inspect-vps:
    name: Inspect VPS tracked changes
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback_vercel_deployment == 'diagnose-vps' }}
    steps:
      - name: Configure SSH
        env:
          VPS_DEPLOY_SSH_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Read tracked file status only
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" 'git -C /home/ubuntu/solarnext-crm rev-parse HEAD && git -C /home/ubuntu/solarnext-crm status --short --untracked-files=no && git -C /home/ubuntu/solarnext-crm diff --stat && git -C /home/ubuntu/solarnext-crm diff --cached --stat'

  vercel-preview:
    name: Build Preview on Vercel
    runs-on: ubuntu-latest
    needs: quality-gates
    if: ${{ vars.DEPLOY_ENABLED == 'true' && vars.DEPLOY_FRONTEND == 'vercel' && (github.event_name != 'workflow_dispatch' || inputs.rollback_vercel_deployment == '') }}
    outputs:
      preview_url: ${{ steps.deploy-preview.outputs.preview_url }}
      previous_production_deployment: ${{ steps.previous-prod.outputs.deployment_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Capture previous production deployment
        id: previous-prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          node <<'NODE' > previous-production-deployment.txt
          const token = process.env.VERCEL_TOKEN;
          const projectId = process.env.VERCEL_PROJECT_ID;
          const teamId = process.env.VERCEL_ORG_ID;
          const url = new URL("https://api.vercel.com/v6/deployments");
          url.searchParams.set("projectId", projectId);
          url.searchParams.set("teamId", teamId);
          url.searchParams.set("target", "production");
          url.searchParams.set("limit", "1");
          const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
          if (!res.ok) throw new Error(`Previous production lookup failed: HTTP ${res.status}`);
          const data = await res.json();
          const deployment = data.deployments?.[0];
          console.log(deployment?.url ? `https://${deployment.url}` : "");
          NODE
          echo "deployment_url=$(cat previous-production-deployment.txt)" >> "$GITHUB_OUTPUT"

      - name: Build and deploy Preview
        id: deploy-preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm ci --prefix frontend
          npx vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          npx vercel build --token="$VERCEL_TOKEN"
          PREVIEW_URL="$(npx vercel deploy --prebuilt --yes --token="$VERCEL_TOKEN")"
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

  preview-smoke-tests:
    name: Validate Vercel Preview
    runs-on: ubuntu-latest
    needs: vercel-preview
    if: ${{ vars.DEPLOY_ENABLED == 'true' && vars.DEPLOY_FRONTEND == 'vercel' && (github.event_name != 'workflow_dispatch' || inputs.rollback_vercel_deployment == '') }}
    steps:
      - name: Preview HTTP and Calpinage assets
        env:
          PREVIEW_URL: ${{ needs.vercel-preview.outputs.preview_url }}
        run: |
          test -n "$PREVIEW_URL"
          curl --fail --silent --show-error "$PREVIEW_URL/"
          curl --fail --silent --show-error "$PREVIEW_URL/config/vite-public-runtime.js"
          curl --fail --silent --show-error "$PREVIEW_URL/calpinage/canvas-bundle.js"
          curl --fail --silent --show-error "$PREVIEW_URL/calpinage/shading/nearShadingCore.cjs"

  deploy-vps:
    name: Deploy Backend to VPS
    runs-on: ubuntu-latest
    needs:
      - quality-gates
      - preview-smoke-tests
    if: ${{ vars.DEPLOY_ENABLED == 'true' && vars.DEPLOY_BACKEND == 'vps' && (github.event_name != 'workflow_dispatch' || inputs.rollback_vercel_deployment == '') }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_DEPLOY_SSH_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Run remote deploy command
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          # Stream the checked-in script from this exact commit. The server's older
          # checkout cannot enforce this release's no-DB guard before its git pull.
          ssh "$VPS_USER@$VPS_HOST" "DEPLOY_REF=$GITHUB_SHA bash -s -- --skip-db" < infrastructure/scripts/deploy.sh

  smoke-tests:
    name: Post-backend Smoke Tests
    runs-on: ubuntu-latest
    needs:
      - quality-gates
      - preview-smoke-tests
      - deploy-vps
    if: ${{ always() && vars.DEPLOY_ENABLED == 'true' && (github.event_name != 'workflow_dispatch' || inputs.rollback_vercel_deployment == '') && needs.quality-gates.result == 'success' && needs.preview-smoke-tests.result == 'success' && needs.deploy-vps.result == 'success' }}
    env:
      API_BASE_URL: ${{ secrets.PRODUCTION_API_BASE_URL }}
    steps:
      - name: Ready endpoint
        run: |
          test -n "$API_BASE_URL"
          curl --fail --silent --show-error "$API_BASE_URL/api/health/ready"

      - name: Financial engine health endpoint
        run: |
          curl --fail --silent --show-error "$API_BASE_URL/api/health/financial-engine"

  promote-vercel:
    name: Promote Validated Vercel Preview
    runs-on: ubuntu-latest
    needs:
      - vercel-preview
      - preview-smoke-tests
      - deploy-vps
      - smoke-tests
    if: ${{ vars.DEPLOY_ENABLED == 'true' && vars.DEPLOY_FRONTEND == 'vercel' && (github.event_name != 'workflow_dispatch' || inputs.rollback_vercel_deployment == '') && needs.preview-smoke-tests.result == 'success' && needs.deploy-vps.result == 'success' && needs.smoke-tests.result == 'success' }}
    steps:
      - name: Promote exact validated Preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          PREVIEW_URL: ${{ needs.vercel-preview.outputs.preview_url }}
          PREVIOUS_PRODUCTION_DEPLOYMENT: ${{ needs.vercel-preview.outputs.previous_production_deployment }}
        run: |
          test -n "$PREVIEW_URL"
          echo "Previous production deployment: $PREVIOUS_PRODUCTION_DEPLOYMENT"
          npx vercel promote "$PREVIEW_URL" --yes --token="$VERCEL_TOKEN"

  production-frontend-smoke-tests:
    name: Validate Vercel Production
    runs-on: ubuntu-latest
    needs: promote-vercel
    if: ${{ vars.DEPLOY_ENABLED == 'true' && vars.DEPLOY_FRONTEND == 'vercel' && (github.event_name != 'workflow_dispatch' || inputs.rollback_vercel_deployment == '') }}
    env:
      FRONTEND_PRODUCTION_URL: ${{ vars.FRONTEND_PRODUCTION_URL }}
    steps:
      - name: Production HTTP and Calpinage assets
        run: |
          FRONTEND_PRODUCTION_URL="${FRONTEND_PRODUCTION_URL:-https://solarnext-crm.fr}"
          test -n "$FRONTEND_PRODUCTION_URL"
          urls=(
            "$FRONTEND_PRODUCTION_URL/"
            "$FRONTEND_PRODUCTION_URL/config/vite-public-runtime.js"
            "$FRONTEND_PRODUCTION_URL/calpinage/canvas-bundle.js"
            "$FRONTEND_PRODUCTION_URL/calpinage/shading/nearShadingCore.cjs"
          )

          for url in "${urls[@]}"; do
            for attempt in {1..12}; do
              if curl --fail --silent --show-error "$url" > /dev/null; then
                break
              fi

              if [ "$attempt" -eq 12 ]; then
                curl --fail --silent --show-error "$url"
              fi

              sleep 5
            done
          done

  deploy-disabled:
    name: Deploy Disabled Notice
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED != 'true' }}
    steps:
      - run: echo "Deployment is disabled. Set repository variable DEPLOY_ENABLED=true and required secrets to activate deploy."
